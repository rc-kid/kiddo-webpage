{% assign url = page.url %}
<header class="topbar">
    <nav class="topbar-in" aria-label="Main">
        <a class="brand" href="{{ '/' | relative_url }}">
            <img src="{{ '/assets/img/mascot.png' | relative_url }}" alt="" width="34" height="34">
            <span class="kd">kidDo</span>
        </a>
        <button class="menu-toggle" aria-expanded="false" aria-controls="menu" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
        <ul class="menu" id="menu">
            <li><a href="{{ '/' | relative_url }}" {% if url == '/' or url == '/index.html' %}aria-current="page"{% endif %}>Home</a></li>
            <li><a href="{{ '/device/' | relative_url }}" {% if url == '/device/' %}aria-current="page"{% endif %}>Device</a></li>
            <li><a href="{{ '/log/' | relative_url }}" {% if url contains '/log/' %}aria-current="page"{% endif %}>Log</a></li>
            <li><a href="{{ '/research/' | relative_url }}" {% if url == '/research/' %}aria-current="page"{% endif %}>Research</a></li>
            <li><a href="{{ '/links/' | relative_url }}" {% if url == '/links/' %}aria-current="page"{% endif %}>Links</a></li>
            <li><a href="{{ '/demo.html' | relative_url }}" {% if url == '/demo.html' %}aria-current="page"{% endif %}>Demo</a></li>
        </ul>
    </nav>
</header>
