{% comment %} Exploded view of the case with labelled parts. Image is 880x700, drawn at 0.7045 scale, offset x=120. {% endcomment %}

    <image href="{{ '/assets/img/device/case-render-exploded.png' | relative_url }}" x="120" y="0" width="620" height="493"/>

    <!-- leaders, left -->
    <path class="wire" d="M416 85 L170 50 H148"/>
    <path class="wire" d="M264 134 L170 130 H148"/>
    <path class="wire" d="M279 321 L170 300 H148"/>
    <path class="wire" d="M331 352 L170 370 H148"/>
    <path class="wire" d="M331 430 L170 440 H148"/>
    <!-- leaders, right -->
    <path class="wire" d="M515 134 L690 70 H712"/>
    <path class="wire" d="M606 129 L690 140 H712"/>
    <path class="wire" d="M581 187 L690 210 H712"/>
    <path class="wire" d="M515 240 L690 280 H712"/>
    <path class="wire" d="M591 304 L690 345 H712"/>
    <path class="wire" d="M451 352 L480 412 H712"/>
    <path class="wire" d="M382 402 L430 470 H712"/>
