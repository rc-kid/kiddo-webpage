{% assign post = include.post %}
<article class="paper log-entry">
    {% if post.image %}<a class="paper-thumb log-thumb" href="{{ post.url | relative_url }}" tabindex="-1"><img src="{{ post.image | relative_url }}" alt="" loading="lazy"></a>{% endif %}
    <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
    <p><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%-d %B %Y" }}</time>{% for t in post.tags %} · {{ t }}{% endfor %}</p>
    <p>{{ post.abstract | default: post.excerpt | strip_html | truncatewords: 60 }}</p>
</article>
