{% assign post = include.post %}
<article class="row">
    <time class="row-meta log-date" datetime="{{ post.date | date_to_xmlschema }}"><span>{{ post.date | date: "%-d" }}</span>{{ post.date | date: "%b %Y" }}</time>
    <div class="row-body">
        <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
        <p>{{ post.abstract | default: post.excerpt | strip_html | truncatewords: 60 }}</p>
    </div>
    {% if post.image %}<a class="row-thumb" href="{{ post.url | relative_url }}" tabindex="-1"><img src="{{ post.image | relative_url }}" alt="" loading="lazy"></a>{% endif %}
</article>
